<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SBC Leaf Swipe Stinger</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Startupbootcamp leaf swipe stinger – left-to-right, full height.
//
// The swipe *is* the leaves: a deep wave of large leaves sweeps in from the
// left (no colour bands behind it). Behind the wave comes the middle card –
// Tranquil Blue with the SBC leaf arrow (official arrow filled with leaves and
// a crown spilling over the top), whose leaves grow in from the bottom up as in
// the Demo Day hype video. A second leaf wave then carries the card off to the
// right, revealing the next item.
//
// window.draw(t) renders time t on a transparent canvas.
// window.renderFrame(t, fps, samples) returns a motion-blurred PNG data URL.
const W = 1920, H = 1080;
const TIMELINE_END = 3.6;           // internal animation timeline
const T0 = 0.27;                    // playback starts here (frame 0 is clear)
const DURATION = 3.05;              // delivered clip length: T0 .. T0 + DURATION

const C = {
  tranquil: '#E8F5F8',   // Tranquil Blue
  white: '#FFFFFF',
  // leaf greens sampled from the SBC leaf arrow artwork
  leaves: ['#3F8F74', '#4A9B7F', '#55A487', '#60AD90', '#6DB89B', '#80C5A8'],
  veinDark: '#1F6E54',
  veinLight: 'rgba(244,250,240,0.92)',
};

// Official SBC arrow geometry (674 x 349 units). Upright only, never altered.
const ARROW_OUTER = [[0,349],[337,0],[674,349],[591,349],[337,84],[83,349]];
const ARROW_INNER = [[163,349],[337,168],[511,349],[430,349],[337,252],[245,349]];

// ---------------------------------------------------------------- timing
const T_EDGE = 1.80;                 // seconds for an edge to travel X0 -> X1
const X0 = -560, X1 = W + 560;       // edge travel (leaf waves fully off-frame at both ends)
const R_IN = 0.00;                   // card leading edge starts
const L_OUT = 1.62;                  // card trailing edge starts
const GROW_START = 0.95, GROW_SPAN = 0.75, LEAF_GROW = 0.32;   // logo leaves grow in

function clamp01(x) { return Math.min(1, Math.max(0, x)); }
function bezier(p1x, p1y, p2x, p2y) {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const sx = u => ((ax * u + bx) * u + cx) * u;
  const sy = u => ((ay * u + by) * u + cy) * u;
  const dsx = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => {
    let u = x;
    for (let i = 0; i < 8; i++) { const d = sx(u) - x; const dd = dsx(u); if (Math.abs(dd) < 1e-6) break; u -= d / dd; }
    return sy(clamp01(u));
  };
}
// symmetric ease-in-out: edges glide in and out of frame, unhurried crossing
const EASE = bezier(0.42, 0, 0.58, 1);
const edgeX = (t, start) => X0 + (X1 - X0) * EASE(clamp01((t - start) / T_EDGE));
const easeOutBack = u => { const c = 1.5; u = clamp01(u) - 1; return 1 + (c + 1) * u * u * u + c * u * u; };

// ---------------------------------------------------------------- random
let seed = 20261001;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
const lerp = (a, b, u) => a + (b - a) * u;

// ---------------------------------------------------------------- leaf sprites
// Leaves drawn to match the hype video: broad almond blades (width ~0.52 x
// length, widest just below the middle, pointed tip), flat sage fill with a
// faint lighter half, straight midrib and six pairs of straight ~45° veins in
// dark green or cream. Pre-rendered at high resolution for crisp large leaves.
const LEAF_LEN = 600, LEAF_WID = LEAF_LEN * 0.52, PAD = 12;
const SPRITE_LEN = LEAF_LEN + 2 * PAD, SPRITE_W = Math.ceil(LEAF_WID + 2 * PAD);
const halfWidth = u => (LEAF_WID / 2) * Math.pow(Math.sin(Math.PI * Math.pow(clamp01(u), 0.9)), 0.9);
function makeLeafSprite(fill, veinColor) {
  const cv = document.createElement('canvas');
  cv.width = SPRITE_LEN; cv.height = SPRITE_W;
  const g = cv.getContext('2d');
  g.translate(PAD, SPRITE_W / 2);
  const outline = () => {
    g.beginPath();
    const N = 100;
    for (let i = 0; i <= N; i++) { const u = i / N; g[i ? 'lineTo' : 'moveTo'](u * LEAF_LEN, -halfWidth(u)); }
    for (let i = N; i >= 0; i--) { const u = i / N; g.lineTo(u * LEAF_LEN, halfWidth(u)); }
    g.closePath();
  };
  outline(); g.fillStyle = fill; g.fill();
  g.save(); outline(); g.clip();
  g.fillStyle = 'rgba(255,255,255,0.07)';
  g.fillRect(0, -LEAF_WID, LEAF_LEN, LEAF_WID);
  g.restore();
  g.strokeStyle = veinColor; g.lineCap = 'round';
  g.lineWidth = 9;
  g.beginPath(); g.moveTo(LEAF_LEN * 0.03, 0); g.lineTo(LEAF_LEN * 0.90, 0); g.stroke();
  g.lineWidth = 6.5;
  for (let i = 0; i < 6; i++) {
    const u0 = 0.13 + i * 0.12, u1 = u0 + 0.15;
    for (const sgn of [-1, 1]) {
      g.beginPath(); g.moveTo(u0 * LEAF_LEN, 0);
      g.lineTo(u1 * LEAF_LEN, sgn * halfWidth(u1) * 0.80); g.stroke();
    }
  }
  return cv;
}
const SPRITES = [];
C.leaves.forEach((col, i) => {
  SPRITES.push(makeLeafSprite(col, i < 4 ? C.veinDark : C.veinLight));
  SPRITES.push(makeLeafSprite(col, i < 2 ? C.veinDark : C.veinLight));
});
const pickSprite = () => SPRITES[(rnd() * SPRITES.length) | 0];

function drawLeaf(g, sp, x, y, len, rot, flip, alpha = 1) {
  const s = len / LEAF_LEN;
  g.save();
  g.translate(x, y);
  g.rotate(rot);
  g.scale(s, flip ? -s : s);
  if (alpha < 1) g.globalAlpha = alpha;
  g.drawImage(sp, -PAD - LEAF_LEN / 2, -SPRITE_W / 2);
  g.restore();
}

// ---------------------------------------------------------------- leaf waves
// Big leaves, fewer of them. Each follows its edge with a lag that varies
// smoothly with height, so the front is an organic wave rather than a line.
function makeWave(count, dxMin, dxMax) {
  const arr = [];
  for (let i = 0; i < count; i++) {
    const y = lerp(-140, H + 140, (i + rnd()) / count);
    const depth = rnd();
    arr.push({
      y, depth,
      dx: lerp(dxMin, dxMax, Math.pow(rnd(), 0.9)),
      len: lerp(260, 420, rnd()) * lerp(0.85, 1.1, depth),
      rot: (rnd() * 2 - 1) * 1.1,
      flutterA: lerp(0.05, 0.12, rnd()), flutterF: lerp(2.5, 4.5, rnd()),
      phase: rnd() * Math.PI * 2,
      lag: 0.07 * (0.5 + 0.5 * Math.sin(y / 210 + 1.3)) + 0.03 * rnd(),
      sprite: pickSprite(), flip: rnd() < 0.5,
    });
  }
  arr.sort((a, b) => a.depth - b.depth);
  return arr;
}
// lead wave: mostly ahead of the card edge; trail wave: mostly behind it
const LEAD = makeWave(64, -280, 300);
const TRAIL = makeWave(64, -300, 280);

// a few leaves peel off the trailing wave and drift away, gone before the end
const LOOSE = [];
for (let i = 0; i < 9; i++) {
  LOOSE.push({
    y: lerp(80, H - 80, (i + rnd()) / 9), dx: lerp(-120, 0, rnd()),
    len: lerp(120, 190, rnd()), rot: (rnd() * 2 - 1) * 1.2,
    spin: (rnd() * 2 - 1) * 1.2, vy: lerp(-70, 40, rnd()),
    release: lerp(2.35, 2.65, rnd()), sprite: pickSprite(), flip: rnd() < 0.5,
  });
}

// ---------------------------------------------------------------- leaf arrow logo
// Rebuilt like the hype video: leaves fill the official arrow's two bands
// (clipped crisply to the arrow shape) and a crown of leaves arches over the
// top, spilling further down the right-hand side.
const LOGO_W = 820;
const LOGO_S = LOGO_W / 674;
const LOGO_CX = W / 2, LOGO_CY = H / 2 + 70;          // centre of the 674x349 box
const toLogo = (ux, uy) => [LOGO_CX + (ux - 337) * LOGO_S, LOGO_CY + (uy - 174.5) * LOGO_S];

function pointInPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const BAND_LEAVES = [], CROWN_LEAVES = [];
(function buildLogo() {
  // band fill: jittered grid over both bands (in arrow units)
  const step = 30;
  for (let uy = -10; uy < 360; uy += step) {
    for (let ux = -10; ux < 690; ux += step) {
      const px = ux + (rnd() - 0.5) * step, py = uy + (rnd() - 0.5) * step;
      const inOuter = pointInPoly(px, py, ARROW_OUTER), inInner = pointInPoly(px, py, ARROW_INNER);
      // also seed just outside the band edges so the clip edge is always fully covered
      const near = [[0, 22], [0, -22], [22, 0], [-22, 0]].some(([dx, dy]) =>
        pointInPoly(px + dx, py + dy, ARROW_OUTER) || pointInPoly(px + dx, py + dy, ARROW_INNER));
      if (!(inOuter || inInner || near)) continue;
      const [x, y] = toLogo(px, py);
      BAND_LEAVES.push({ x, y, len: lerp(110, 160, rnd()), rot: rnd() * Math.PI * 2,
        sprite: pickSprite(), flip: rnd() < 0.5 });
    }
  }
  // crown: a smooth leafy dome hugging the outer chevron's upper edges.
  // Leaves are stratified along the edge, tips pointing outward, tallest over
  // the apex and tapering down each side (the right side spills further).
  const N = 96;
  for (let i = 0; i < N; i++) {
    const along = lerp(-0.50, 0.92, (i + rnd()) / N);  // <0 left edge, >0 right edge
    let ux, uy;
    if (along < 0) { const k = 1 + along; ux = 337 * k; uy = 349 * (1 - k); }
    else { ux = 337 + 337 * along; uy = 349 * along; }
    const span = along < 0 ? 0.50 : 0.92;
    const dome = Math.cos(Math.min(1, Math.abs(along) / span) * Math.PI / 2);   // 1 at apex -> 0 at ends
    const nx = along < 0 ? -0.72 : 0.72, ny = -0.69;     // outward normal of each edge
    const layer = i % 2;                                 // two layers: inner + outer
    const bulge = along > 0 ? Math.exp(-Math.pow((along - 0.72) / 0.14, 2)) : 0;   // right-side spill
    const out = layer ? lerp(40, 72, rnd()) * (0.75 + 0.25 * Math.sqrt(dome) + 0.5 * bulge)
                      : lerp(-10, 25, rnd());
    // blend normal toward straight-up near the apex so the dome reads round
    const dirx = nx * (1 - 0.25 * dome), diry = ny - 0.08 * dome;
    const [x, y] = toLogo(ux + dirx * out, uy + diry * out);
    const outward = Math.atan2(diry, dirx);
    CROWN_LEAVES.push({ x, y, len: lerp(125, 170, rnd()),
      rot: outward + (rnd() * 2 - 1) * 0.65, sprite: pickSprite(), flip: rnd() < 0.5 });
  }
  // grow order: bottom-up for the bands, the crown last (as in the hype video)
  const ys = BAND_LEAVES.map(l => l.y), yMin = Math.min(...ys), yMax = Math.max(...ys);
  BAND_LEAVES.forEach(l => { l.delay = 0.62 * (yMax - l.y) / (yMax - yMin) + 0.06 * rnd(); });
  CROWN_LEAVES.forEach(l => { l.delay = 0.50 + 0.25 * rnd(); });
  BAND_LEAVES.sort(() => rnd() - 0.5);
  CROWN_LEAVES.sort(() => rnd() - 0.5);
})();

function arrowPath(g, poly, ox, oy, s) {
  poly.forEach(([x, y], i) => {
    const px = ox + (x - 337) * s, py = oy + (y - 174.5) * s;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  });
  g.closePath();
}

function growScale(t, delay) {
  return easeOutBack((t - GROW_START - delay * (GROW_SPAN / 0.75)) / LEAF_GROW);
}

function drawLogo(g, t, dx) {
  g.save();
  g.translate(dx, 0);
  // solid SBC Green official arrow; the leaves grow over it (as in the hype video)
  g.fillStyle = '#008C8C';
  g.beginPath(); arrowPath(g, ARROW_OUTER, LOGO_CX, LOGO_CY, LOGO_S); arrowPath(g, ARROW_INNER, LOGO_CX, LOGO_CY, LOGO_S); g.fill();
  // band leaves, clipped to the official arrow shape
  g.save();
  g.beginPath(); arrowPath(g, ARROW_OUTER, LOGO_CX, LOGO_CY, LOGO_S); arrowPath(g, ARROW_INNER, LOGO_CX, LOGO_CY, LOGO_S);
  g.clip();
  g.shadowColor = 'rgba(20,60,50,0.28)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
  for (const l of BAND_LEAVES) {
    const k = growScale(t, l.delay);
    if (k <= 0.001) continue;
    drawLeaf(g, l.sprite, l.x, l.y, l.len * k, l.rot, l.flip);
  }
  g.restore();
  // crown, unclipped, spilling over the top
  g.save();
  g.shadowColor = 'rgba(20,60,50,0.30)'; g.shadowBlur = 12; g.shadowOffsetY = 5;
  for (const l of CROWN_LEAVES) {
    const k = growScale(t, l.delay);
    if (k <= 0.001) continue;
    drawLeaf(g, l.sprite, l.x, l.y, l.len * k, l.rot + 0.15 * (1 - Math.min(k, 1)), l.flip);
  }
  g.restore();
  g.restore();
}

// ---------------------------------------------------------------- card + waves
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// wavy card edge (hidden under leaves, so no straight line can ever show)
function cardPath(g, L, R) {
  g.beginPath();
  const wob = y => 38 * Math.sin(y / 130 + 0.7) + 22 * Math.sin(y / 57 + 2.1);
  g.moveTo(L + wob(-20), -20);
  for (let y = -20; y <= H + 20; y += 20) g.lineTo(R + wob(y + 300), y);
  for (let y = H + 20; y >= -20; y -= 20) g.lineTo(L + wob(y), y);
  g.closePath();
}

function drawCard(g, t, L, R) {
  g.save();
  cardPath(g, L, R);
  g.clip();
  // Tranquil Blue with a soft white glow and large faint official arrows (hype style)
  const grad = g.createRadialGradient(W * 0.55, H * 0.35, 60, W * 0.5, H * 0.5, W * 0.75);
  grad.addColorStop(0, '#FFFFFF'); grad.addColorStop(1, C.tranquil);
  g.fillStyle = grad; g.fillRect(-20, -20, W + 40, H + 40);
  const ride = (edgeX(t, R_IN) - X1) * 0.30 + (edgeX(t, L_OUT) - X0) * 0.30;   // gentle parallax
  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.beginPath(); arrowPath(g, ARROW_OUTER, W * 0.5 + ride * 0.6, H * 0.62, 2600 / 674); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.35)';
  g.beginPath(); arrowPath(g, ARROW_INNER, W * 0.5 + ride * 0.6, H * 0.62, 2600 / 674); g.fill();
  drawLogo(g, t, ride);
  g.restore();
}

function drawWave(g, t, leaves, start, lead) {
  for (const lf of leaves) {
    const ex = edgeX(t - lf.lag, start);
    const x = ex + lf.dx;
    if (x < -460 || x > W + 460) continue;
    const speed = Math.abs(edgeX(t - lf.lag + 0.01, start) - ex) / 0.01;
    const sp = Math.min(speed / 3000, 1);
    const flutter = lf.flutterA * Math.sin(t * lf.flutterF + lf.phase) * (0.4 + sp);
    const lean = (lead ? -0.10 : 0.08) * sp;
    drawLeaf(g, lf.sprite, x, lf.y, lf.len, lf.rot + flutter + lean, lf.flip);
  }
}

window.draw = function (t) {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  const R = edgeX(t, R_IN), L = edgeX(t, L_OUT);
  if (R > L) drawCard(g, t, L, R);
  g.save();
  g.shadowColor = 'rgba(16,45,40,0.22)'; g.shadowBlur = 16; g.shadowOffsetY = 6;
  drawWave(g, t, TRAIL, L_OUT, false);
  drawWave(g, t, LEAD, R_IN, true);
  for (const lf of LOOSE) {
    if (t < lf.release) continue;
    const dt = t - lf.release;
    const x = edgeX(lf.release, L_OUT) + lf.dx + 520 * dt * (1 - Math.min(dt, 0.5));
    const y = lf.y + lf.vy * dt + 80 * dt * dt;
    const a = 1 - clamp01((dt - 0.15) / 0.35);
    if (a <= 0) continue;
    drawLeaf(g, lf.sprite, x, y, lf.len, lf.rot + lf.spin * dt, lf.flip, a);
  }
  g.restore();
};

// Motion-blurred frame: average `samples` sub-frames over a 90° shutter,
// accumulated in premultiplied alpha, returned as a PNG data URL.
const acc = new Float32Array(W * H * 4);
const out = document.createElement('canvas'); out.width = W; out.height = H;
const octx = out.getContext('2d');
window.renderFrame = function (t, fps, samples) {
  t += T0;
  acc.fill(0);
  for (let s = 0; s < samples; s++) {
    const ts = Math.min(TIMELINE_END, Math.max(0, t + ((s + 0.5) / samples - 0.5) * (0.25 / fps)));
    window.draw(ts);
    const d = ctx.getImageData(0, 0, W, H).data;
    for (let i = 0; i < d.length; i += 4) {
      const a = d[i + 3];
      if (a === 0) continue;
      acc[i] += d[i] * a; acc[i + 1] += d[i + 1] * a; acc[i + 2] += d[i + 2] * a; acc[i + 3] += a;
    }
  }
  const img = octx.createImageData(W, H);
  const o = img.data;
  for (let i = 0; i < o.length; i += 4) {
    const a = acc[i + 3];
    if (a === 0) continue;
    o[i] = acc[i] / a; o[i + 1] = acc[i + 1] / a; o[i + 2] = acc[i + 2] / a;
    o[i + 3] = Math.round(a / samples);
  }
  octx.putImageData(img, 0, 0);
  return out.toDataURL('image/png');
};
window.DURATION = DURATION;
window.ready = true;
</script>
</body>
</html>
